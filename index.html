<style>
:root{--bg:#121824;--card:#1e2530;--text:#f0f4f8;--mut:#9fb0c3;--bd:#4a90e2;--pri:#5da9e9;--wa:#25d366;--ok:#2ecc71;--warn:#f0b429}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;padding:14px;display:flex;justify-content:center}
.w{max-width:560px;width:100%}header{background:linear-gradient(135deg,#5da9e9,#4a90e2);border-radius:20px;padding:14px;text-align:center;margin-bottom:12px;color:#fff}
.hd{display:flex;align-items:center;justify-content:center;gap:12px}.lg{width:52px;height:52px;border-radius:50%;border:2px solid #fff;object-fit:cover}
h1{margin:0;font-size:1.25em}.gn{font-size:.85em;font-weight:bold;letter-spacing:1px;opacity:.95;margin-top:2px}
header small{display:block;opacity:.95;margin-top:6px}
#tm{font-weight:bold;font-size:1.05em;margin:6px 0}
.hb{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}.hb button{background:#fff;color:#1a4f8a;border:0;border-radius:10px;padding:6px 10px;font-weight:bold;cursor:pointer;font-size:.78em}
.hb button.tg{background:#ffffff33;color:#fff;border:1px solid #ffffff88}.hb button.tg.on{background:#fff;color:#1a4f8a}
.mk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.mk .mc.w{flex:1 1 100%}.mk .mc{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;min-width:0}
.mk .ml{font-size:.74em;color:var(--mut);display:flex;justify-content:space-between;gap:6px}.mk .mv{font-size:1.25em;font-weight:900;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mk .ms{direction:rtl;font-size:.7em;color:var(--mut);display:flex;justify-content:space-between;margin-top:1px}.mk .up{color:#22c55e}.mk .dn{color:#ef4444}.mk .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#64748b;margin-inline-start:4px}.mk .dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}
.wx{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:.85em;line-height:1.7}
.wx.warn{border-color:var(--warn);background:#2a2415}.wx b{color:var(--pri)}.wx .row{display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:.92em}
.wx .row span{white-space:nowrap}.wx .wn{color:var(--warn);font-weight:bold}
input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--text);font:inherit;margin-bottom:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:8px}.tabs button{background:var(--card);color:var(--text);border:2px solid var(--ac,var(--bd));border-radius:14px;padding:10px 6px;font-weight:bold;font-size:.88em;cursor:pointer;line-height:1.35}
.tabs button.on{background:var(--ac,var(--bd));color:#fff;text-shadow:0 1px 2px #0008}
.card{position:relative;background:var(--card);border:1px solid #4a90e255;border-inline-start:6px solid var(--ac,#4a90e2);border-radius:18px;margin:20px 0;overflow:hidden;box-shadow:0 4px 14px #0007}.card{background:color-mix(in srgb,var(--ac,#4a90e2) 11%,var(--card))}.card .m{color:var(--ac,var(--pri))}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 4px;padding:10px 14px;border-radius:14px;background:var(--ac);color:#fff;font-weight:bold;text-shadow:0 1px 2px #0007}.sec small{font-weight:normal;opacity:.95}
.card.done{opacity:.62}
.card .ci{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0003}
.b{padding:12px}.m{font-size:.72em;color:var(--pri);font-weight:bold}.card h2{font-size:1.02em;margin:5px 0;line-height:1.55}
.card p{margin:0 0 6px;color:var(--mut);font-size:.88em;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.chip{font-size:.7em;font-weight:bold;border-radius:20px;padding:3px 9px;border:1px solid var(--bd);color:var(--mut);background:transparent;cursor:default;line-height:1.4}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.pri{color:var(--pri)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.btn{cursor:pointer}
.sp{margin:6px 0;border:1px dashed var(--bd);border-radius:10px;padding:6px 8px;font-size:.78em}
.sp .sr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
.sp .sr a,.sp .sr button{font-size:.9em;padding:3px 8px}
.ra{display:flex;gap:8px;align-items:center;margin-top:8px}
.md{font-size:.72em;color:var(--mut);border:1px dashed var(--bd);border-radius:8px;padding:5px 8px;line-height:1.4}
.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card button,.card a{flex:none;text-align:center;text-decoration:none;border:0;border-radius:9px;padding:6px 10px;font-weight:bold;cursor:pointer;font-size:.78em;color:#fff;line-height:1.3}
.wa{background:var(--wa)}.cp{background:#34495e}.ln{border:1px solid var(--bd)!important;color:var(--pri)!important;background:none}
.card .sh{background:#128c7e;font-size:.95em;padding:11px 18px}
.vt{background:var(--bg);border:1px solid var(--bd)!important;color:var(--text)!important}.vt.on{background:var(--bd)}
.n{text-align:center;color:var(--mut);padding:20px}.n button{background:none;border:1px solid var(--bd);color:var(--pri);border-radius:10px;padding:6px 12px;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;display:none;max-width:90%;text-align:center;z-index:9}
#bm{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#bm .bx{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
#bm .it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff14}
#bm button{background:var(--bd);color:#fff;border:0;border-radius:9px;padding:5px 10px;cursor:pointer;font-weight:bold}

.no{position:absolute;top:8px;left:8px;z-index:2;background:color-mix(in srgb,var(--ac,#4a90e2) 78%,#000);color:#fff;border:1px solid #fffa;border-radius:14px;padding:2px 10px;font-size:.85em;font-weight:bold;line-height:1.5;direction:ltr}
.no small{font-weight:normal;opacity:.85;direction:rtl}
.card .m{padding-left:46px;min-height:1.6em}
.mp{padding:4px 8px}.mr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff12;cursor:pointer}.mr:last-child{border:0}
.mr input{width:auto;margin:0;flex:none;accent-color:#25d366;transform:scale(1.25)}
.mr .th{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#0005;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.3em}
.mr .mt{flex:1;line-height:1.5}.mr .st{font-size:.9em;color:var(--mut);white-space:nowrap}.mr .st.ok{color:var(--ok)}.mr .st.er{color:#e74c3c}
.mr a{padding:3px 7px!important}
.npw{text-align:center;margin:22px 0 8px}.npb{background:linear-gradient(135deg,#f5e6c4,#e8d29a);color:#3a2a08;border:2px solid #b8963e;border-radius:14px;padding:13px 18px;font-weight:bold;font-size:.95em;cursor:pointer;width:100%}
#pm{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:12;padding:14px}
#pm .bx{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;max-width:460px;width:100%;max-height:88vh;overflow:auto;text-align:center}
#pm button{background:var(--bd);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-weight:bold;cursor:pointer;margin:4px;font-size:.95em}
#pm button.g{background:#25d366}#pm button.x{background:#34495e}
#pm .pv{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin:10px 0}#pm .pv img{width:100%;border-radius:6px;border:1px solid #ffffff22}
#ft{text-align:center;color:var(--mut);font-size:.72em;margin:14px 0 30px;line-height:1.7}
#nph{position:absolute;left:-10000px;top:0;width:794px}
.pg{width:794px;height:1123px;background:#f7f2e6;color:#141414;padding:30px 34px 20px;display:flex;flex-direction:column;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic","Segoe UI",Tahoma,serif;direction:rtl;box-sizing:border-box;overflow:hidden}
.pg .mh{text-align:center;border-bottom:4px double #141414;padding-bottom:8px;margin-bottom:10px}
.pg .mh .t1{display:flex;align-items:center;justify-content:center;gap:14px}
.pg .mh img{width:64px;height:64px;border-radius:50%;border:2px solid #141414;object-fit:cover}
.pg .mh h1{margin:0;font-size:38px;line-height:1.25;font-weight:bold}.pg .mh .en{font-size:15px;letter-spacing:3px;direction:ltr;font-weight:bold}
.pg .mh .dl{display:flex;justify-content:space-between;border-top:1px solid #141414;margin-top:8px;padding-top:4px;font-size:14px}
.pg .sh2{font-size:13px;border-bottom:2px solid #141414;padding-bottom:4px;margin-bottom:10px;display:flex;justify-content:space-between}
.pg .pbd{flex:1;min-height:0;display:flex;gap:0}
.pg .pcol{flex:1;min-width:0;overflow:hidden}.pg .pcol+.pcol{border-inline-start:1px solid #14141466;padding-inline-start:14px;margin-inline-start:14px}
.pg .st{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #14141433}
.pg .st h3{margin:4px 0;font-size:16.5px;line-height:1.5;font-weight:900}.pg .st p{margin:0 0 4px;font-size:12.5px;line-height:1.65;color:#2a2a2a;font-weight:400}
.pg .si{border:1px solid #14141455;background:#fff}
.pg .sm{font-size:11px;color:#555}
.pg .ld{border-bottom:3px solid #141414;margin-bottom:12px}.pg .ld h3{font-size:25px;line-height:1.45;font-weight:900}.pg .ld p{font-size:14px;font-weight:400}
.pg .pft{text-align:center;font-size:11px;color:#555;border-top:1px solid #14141466;padding-top:5px;margin-top:6px}

.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card .tb{flex:1 1 auto;background:#1b2536;border:1px solid var(--bd)!important;color:var(--text)!important;font-size:.76em;padding:9px 8px;border-radius:10px;white-space:nowrap}
.card .tb.dn.on{background:#c0392b;border-color:#c0392b!important;color:#fff!important}
.op{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:8px;border:1px dashed var(--bd);border-radius:10px;background:#0002}
.npw{margin:4px 0 6px}.npb{padding:10px 14px;font-size:.9em}
.wx{padding:12px}.wxh{display:flex;justify-content:space-between;align-items:center;font-size:.85em;color:var(--pri);font-weight:bold}.wxh small{color:var(--mut);font-weight:normal}
.wxm{display:flex;align-items:center;gap:12px;margin:8px 0}.wxi{font-size:2.8em;line-height:1}.wxt{font-size:2.1em;font-weight:bold;line-height:1.1;direction:ltr}.wxs{font-size:.8em;color:var(--mut);line-height:1.7}.wxs b{color:var(--text);font-size:1.1em}
.wxg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wxw{margin-bottom:10px}.wxt2{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.wxt2::-webkit-scrollbar{display:none}
#u{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.5;margin:4px 0 2px}#u .ul{font-size:.78em;opacity:.8}#u .ud{font-size:1.02em}#u .ud b{font-weight:900}#u .ut{font-size:1.15em;font-weight:900;direction:rtl}
#toast{white-space:pre-line;line-height:1.7;width:max-content;max-width:92vw}
