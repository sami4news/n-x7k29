const msg=n=>`*${n.t}*\n\n${n.b?n.b+"\n\n":""}${n.vid?"🎥 "+n.vid+"\n":""}🔗 ${n.s}`;
const num=(n,one,two,few,many)=>n===1?one:n===2?two:n<=10?n+" "+few:n+" "+many;
function ago(ts){const m=Math.floor(Math.max(0,Date.now()/1000-ts)/60);
 if(m<1)return"الآن";if(m<60)return"قبل "+num(m,"دقيقة","دقيقتين","دقائق","دقيقة");
 const h=Math.floor(m/60);if(h<24)return"منذ "+num(h,"ساعة","ساعتين","ساعات","ساعة");
 const d=Math.floor(h/24);return"منذ "+num(d,"يوم","يومين","أيام","يومًا")}
/* ===== التعلّم من التفضيلات (محفوظ في متصفحك) ===== */
const toks=t=>[...new Set(t.replace(/[\u064B-\u0652ـ]/g,"").split(/[^\u0621-\u064Aa-zA-Z0-9]+/).filter(w=>w.length>=4))];
const score=n=>Math.max(-6,Math.min(6,(P.c[n.c]||0)*.6+(P.s[n.src]||0)*.6+toks(n.t).reduce((a,w)=>a+(P.w[w]||0)*.5,0)));
function vote(n,v){const old=V[n.s]||0,nv=old===v?0:v,d=nv-old;
 P.c[n.c]=(P.c[n.c]||0)+d;P.s[n.src]=(P.s[n.src]||0)+d;toks(n.t).forEach(w=>P.w[w]=(P.w[w]||0)+d);
 if(nv)V[n.s]=nv;else delete V[n.s];LS.set("pf",P);LS.set("vt",V);
 toast(nv>0?"👍 سأعرض لك المزيد من هذا النوع":nv<0?"👎 سأقلّل هذا النوع":"تم إلغاء التقييم");R()}
$("rs").onclick=()=>{if(confirm("مسح كل تفضيلاتك؟")){P={c:{},s:{},w:{}};V={};LS.set("pf",P);LS.set("vt",V);R()}};
/* ===== المشاركة بالوسائط (العنوان فقط) ===== */
const FC={};
const prox=(u,w=1280)=>"https://images.weserv.nl/?url="+encodeURIComponent(u.replace(/^https?:\/\//,""))+"&w="+w+"&q=92&output=jpg";
const isMp4=n=>n.vid&&/\.mp4/i.test(n.vid);
async function getFile(url,name,type){const r=await fetch(url);if(!r.ok)throw 0;const b=await r.blob();return new File([b],name,{type:b.type||type})}
async function prep(n){if(FC[n.s])return FC[n.s];const f=[];
 if(n.img){try{f.push(await getFile(prox(n.img),"news.jpg","image/jpeg"))}catch(e){}}
 if(isMp4(n)){try{const x=await getFile(n.vid,"news.mp4","video/mp4");if(x.size<45e6)f.push(x)}catch(e){}}
 return FC[n.s]=f}
const planTxt=n=>{const p=[];if(n.img)p.push("🖼️ صورة");if(isMp4(n))p.push("🎥 فيديو");return p.length?"📎 سيُرفق: "+p.join(" + "):"📎 بلا وسائط (العنوان فقط)"};
const doneTxt=f=>{const i=f.filter(x=>x.type.startsWith("image")).length,v=f.filter(x=>x.type.startsWith("video")).length,p=[];if(i)p.push("🖼️ "+i+" صورة");if(v)p.push("🎥 "+v+" فيديو");return p.length?"✅ جاهز: "+p.join(" + "):"⚠️ تعذّر تحميل الوسائط"};
function dl(f){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function shareFull(n,b,chip){const text=n.t,old="📤 مشاركة بالوسائط";
 try{await navigator.clipboard.writeText(text)}catch(e){}
 b.textContent="⏳ جارٍ التحميل...";const files=await prep(n);chip.textContent=doneTxt(files);
 try{
  if(files.length&&navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text,title:n.t});toast("اختر واتساب ثم القروب. نُسخ العنوان؛ الصقه كتعليق إن لم يظهر",4500)}
  else if(navigator.share){await navigator.share({text,title:n.t})}
  else{open("https://wa.me/?text="+encodeURIComponent(text));files.forEach(dl);toast("نُزّلت الوسائط؛ أرفقها يدويًا في واتساب",4500)}
 }catch(e){if(e&&e.name==="NotAllowedError"){b.textContent="👆 اضغط مرة أخرى للإرسال";return}if(!e||e.name!=="AbortError")toast("تعذّرت المشاركة")}
 b.textContent=old}
/* ===== العرض ===== */
function R(){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k==cat));
const q=$("q").value.trim(),L=$("l");L.innerHTML="";
let a=D.filter(n=>(cat=="all"||(cat=="taif"?n.tf:n.c==cat))&&(!q||(n.t+n.b).includes(q))).map(n=>({n,sc:score(n)}));
const hid=a.filter(x=>V[x.n.s]<0||x.sc<=-3);if(!showHid)a=a.filter(x=>!hid.includes(x));
a.sort((x,y)=>(y.n.ts+y.sc*7200)-(x.n.ts+x.sc*7200));
if(hid.length&&!showHid){const d=document.createElement("div");d.className="n";d.innerHTML=`أُخفي ${hid.length} خبر حسب تفضيلاتك `;const b=document.createElement("button");b.textContent="إظهارها";b.onclick=()=>{showHid=true;R()};d.append(b);L.append(d)}
if(!a.length&&!hid.length){L.innerHTML='<div class="n">لا توجد أخبار</div>';return}
a.forEach(({n})=>{const d=document.createElement("div");d.className="card";
if(n.img){const i=document.createElement("img");i.loading="lazy";i.referrerPolicy="no-referrer";let tried=0;i.onerror=()=>{if(!tried++)i.src=n.img;else i.remove()};i.onload=()=>{if(i.naturalWidth&&i.naturalWidth<250)i.remove()};i.src=prox(n.img,1200);d.append(i)}
const b=document.createElement("div");b.className="b";
const m=document.createElement("div");m.className="m";m.append(`${C[n.c]} • ${n.src} • `);
const ag=document.createElement("span");ag.className="ago";ag.dataset.ts=n.ts;ag.textContent=ago(n.ts);m.append(ag);
const h=document.createElement("h2");h.textContent=n.t;const p=document.createElement("p");p.textContent=n.b;
const mk=(cls,txt,fn)=>{const x=document.createElement("button");x.className=cls;x.textContent=txt;x.onclick=()=>fn(x);return x};
const chip=document.createElement("div");chip.className="md";chip.textContent=planTxt(n);
const ra=document.createElement("div");ra.className="ra";ra.append(mk("sh","📤 مشاركة بالوسائط",x=>shareFull(n,x,chip)),chip);
const r=document.createElement("div");r.className="r";
r.append(mk("wa","📲 نص",()=>open("https://wa.me/?text="+encodeURIComponent(msg(n)))),
 mk("cp","📋 نسخ",x=>navigator.clipboard.writeText(msg(n)).then(()=>x.textContent="✅ تم")));
const k=document.createElement("a");k.className="ln";k.href=n.vid||n.s;k.target="_blank";k.textContent=n.vid?"🎥 فيديو":"🔗 المصدر";r.append(k,
 mk("vt"+(V[n.s]>0?" on":""),"👍 أكثر",()=>vote(n,1)),mk("vt"+(V[n.s]<0?" on":""),"👎 أقل",()=>vote(n,-1)));
b.append(m,h,p,ra,r);d.append(b);L.append(d)})}
/* ===== التحديث ===== */
async function fetchJSON(){const t=tok();
 if(t){try{const r=await fetch(`https://api.github.com/repos/${REPO}/contents/news.json?ref=main&_=${Date.now()}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github.raw+json"},cache:"no-store"});if(r.ok)return await r.json()}catch(e){}}
 return await (await fetch("news.json?"+Date.now(),{cache:"no-store"})).json()}
function hdr(){$("u").textContent=UP?"آخر تحديث: "+new Date(UP*1000).toLocaleString("ar-SA"):"بانتظار أول تحديث"}
async function load(manual){lastPoll=Date.now();
 try{const j=await fetchJSON();
  if(j.updated!==UP||!D.length){UP=j.updated;D=j.items;R();hdr();if(manual)toast("✅ تم تحميل أحدث الأخبار")}
  else if(manual)toast("لا جديد بعد في الأخبار المحفوظة")}
 catch(e){if(manual)toast("تعذّر التحميل")}}
async function dispatch(){const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches`,{method:"POST",headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({ref:"main"})});let m="";if(r.status!==204){try{m=(await r.json()).message||""}catch(e){}}return{st:r.status,m}}
function setKey(){const t=prompt("الصق رمز GitHub (Fine-grained token بصلاحية Actions: Read and write على مستودع الأخبار فقط).\nيُحفظ في متصفحك فقط. اترك الخانة فارغة لحذف الرمز المحفوظ.");
 if(t===null)return false;LS.set("gt",t.trim());toast(t.trim()?"✅ تم حفظ الرمز":"تم حذف الرمز");return !!t.trim()}
async function forceRefresh(auto){if(busy)return;
 if(!tok()){if(auto)return;toast("للتحديث الفوري اربط الرمز أولًا (زر 🔑)؛ سأحمّل المحفوظ الآن");await load(true);return}
 busy=true;$("rf").textContent="⏳ جارٍ التحديث...";
 let res={st:0,m:""};try{res=await dispatch()}catch(e){res.m=String(e)}
 if(res.st!==204){busy=false;$("rf").textContent="🔄 تحديث الآن";
  const why={401:"الرمز خاطئ أو منتهي أو فيه نسخ ناقص",403:"الرمز لا يملك صلاحية Actions: Read and write",404:"الرمز لا يشمل مستودع n-x7k29 أو الملف update.yml غير موجود",422:"ملف update.yml ينقصه workflow_dispatch"}[res.st]||"سبب غير معروف";
  if(res.st===401)LS.set("gt","");
  alert("تعذّر تشغيل التحديث\nرمز الخطأ: "+res.st+"\nالسبب المرجّح: "+why+"\nرسالة GitHub: "+res.m);return}
 toast("⏳ بدأ الجلب من المصادر... يستغرق نحو دقيقة",4000);
 const prev=UP,t0=Date.now();
 while(Date.now()-t0<180000){await sleep(8000);try{const j=await fetchJSON();if(j.updated!==prev){UP=j.updated;D=j.items;R();hdr();toast("✅ تم التحديث");break}}catch(e){}}
 busy=false;$("rf").textContent="🔄 تحديث الآن"}
function tick(){if(!UP){$("tm").textContent="—";return}
 const left=UP+600-Math.floor(Date.now()/1000);
 if(left>0){$("tm").textContent="⏱ التحديث القادم بعد "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")}
 else{$("tm").textContent=busy?"⏳ جارٍ التحديث...":"⏳ بانتظار التحديث...";
  if(!busy&&Date.now()-lastPoll>20000)load(false);
  if(!busy&&left<-90&&tok()&&Date.now()-lastAuto>240000){lastAuto=Date.now();forceRefresh(true)}}}
$("rf").onclick=()=>forceRefresh(false);
$("kb").onclick=()=>{setKey()};
load(false);setInterval(tick,1000);
setInterval(()=>document.querySelectorAll(".ago").forEach(e=>e.textContent=ago(+e.dataset.ts)),30000);
</script></body></html>
