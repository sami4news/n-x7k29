name: taif-quick

# تحديث الطائف السريع: يُشغَّل من زر «⚡ تحديث أخبار الطائف فقط» في الموقع. خلاصات الطائف وقنواته فقط، ويكتب taif.json (مستقل عن news.json)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taif-quick
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TAIFQ: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install pillow googlenewsdecoder "selectolax<1.0"

      - name: fetch taif news
        run: python fetch_news.py

      - name: commit taif.json (retry safely)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          [ -f taif.json ] || { echo "no taif.json"; exit 0; }
          cp taif.json "$RUNNER_TEMP/taif.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/taif.json" taif.json
            git add taif.json
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -qm "taif quick"
            if git push -q origin HEAD:main; then echo "pushed (try $i)"; exit 0; fi
            echo "push rejected, retrying ($i)"; sleep $((i * 4))
          done
          echo "could not push after retries"; exit 1
